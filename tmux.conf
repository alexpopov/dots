# Shim for tmux < 3.1, which only reads ~/.tmux.conf (no XDG support).
#
# tmux >= 3.1 loads EVERY file on its search path, not just the first one it
# finds (check `tmux display -p '#{config_files}'`). So if this sourced the XDG
# config unconditionally, newer tmux would run the whole config twice on
# startup. That runs tpm twice, so tmux-continuum fires two concurrent
# auto-restores. Both see a "from scratch" server and race on pane indices,
# which leaves extra panes and makes every select-layout fail ("have N panes
# but need M"). The symptom: the cold-boot restore loses pane layouts but a
# manual prefix+R works fine.
#
# Reloads (prefix C-r, bootstrap.sh) source ~/.config/tmux/tmux.conf directly
# for the same reason.
if-shell 'case "$(tmux -V)" in *" "[012].*|*" "3.0*) exit 0;; *) exit 1;; esac' 'source-file ~/.config/tmux/tmux.conf'
