# kitty config — roughly mirrors the ghostty setup (light theme, SFMono).
# Reload after editing: ⌘+⌃+, (macOS) or `kill -SIGUSR1 $(pgrep kitty)`.

# ── Font ───────────────────────────────────────────────────────────────
# Apple's SF Mono @ 12, Light weight (the Regular face reads too heavy).
# NB: the "SFMono Nerd Font" patch isn't installed on this machine, and
# kitty (unlike ghostty's fuzzy CoreText matching) falls back to Menlo —
# noticeably heavier — when a family isn't found. So name the real installed
# family + style explicitly. kitty's built-in Nerd Font still provides
# icon/powerline glyphs via symbol fallback.
font_family      family="SF Mono" style="Light"
font_size        12.0

# Glyph compositing. macOS default is `platform` (== gamma 1.7, contrast 30),
# which renders dark-on-light text a touch heavier than ghostty. The 1st
# number is gamma (thickness of dark text on light bg): lower = thinner.
# Nudged 1.7 -> 1.5 to shave the extra weight. Tune: ~1.3 = thinner still,
# 1.7 = kitty default.
text_composition_strategy  1.5 30

# ── Padding ────────────────────────────────────────────────────────────
# Breathing room around the text (in pts). One value = all sides; you can
# also pass up to 4: `top right bottom left`.
window_padding_width   4

# ── Colors (ported verbatim from the iTerm2 "Default" profile) ──────────
# Apple system colors on white. The previous hand-rolled palette read
# muddy; these are the exact ANSI values iTerm2 uses so prompt/output
# colors match it 1:1.
background       #ffffff
foreground       #1a1a1a

# Selection + cursor, also from the iTerm2 Default profile.
selection_background #bbdcff
selection_foreground #1a1a1a
cursor               #007aff

# 16-color ANSI palette (iTerm2 Default profile).
color0  #000000
color8  #575757
color1  #e7291e
color9  #fc1005
color2  #19b230
color10 #00cb1e
color3  #ffcc00
color11 #ffcc00
color4  #007aff
color12 #5555ff
color5  #af52de
color13 #ff55ff
color6  #00c7be
color14 #00ced0
color7  #e6e6e6
color15 #ffffff

# ── Cursor ─────────────────────────────────────────────────────────────
# ghostty: block cursor, blinking
cursor_shape           block
cursor_blink_interval  0.5

# ── Shell ──────────────────────────────────────────────────────────────
# Enabled now that the login shell is a modern Homebrew bash 5.x (see
# setup_login_shell in bootstrap.sh). The old breakage was macOS's ancient
# system bash 3.2.57: it couldn't do kitty's `set +o posix` handshake during
# the --posix injection and threw errors sourcing ~/.bash_profile (fzf,
# git-completion, tmux-* / manifold-rebind). bash 5 handles it fine, so we
# get OSC-133 prompt marks (last-command-output, jump-to-prompt, etc).
# NOTE: those marks don't cross tmux, so command-boundary features only work
# in non-tmux kitty windows. Requires $SHELL to point at bash 5 (a new login
# session after setup_login_shell); on bash 3.2 this re-triggers the --posix
# breakage above, so set it back to `disabled` if you ever land on 3.2 again.
shell_integration enabled

# ── Clipboard ──────────────────────────────────────────────────────────
# ghostty: copy-on-select = clipboard
copy_on_select         clipboard
# ghostty: ctrl+v = paste
map ctrl+v             paste_from_clipboard
# Let programs read the clipboard without the "wants to read from the system
# clipboard" prompt (e.g. Claude Code, editors doing OSC-52). Note: this is
# global (no per-program allowlist) and means a program on a REMOTE host over
# ssh could read your Mac clipboard silently too. Drop `read-clipboard
# read-primary` back to `read-clipboard-ask read-primary-ask` to restore asking.
clipboard_control      write-clipboard write-primary read-clipboard read-primary

# On paste, silently strip dangerous terminal control codes instead of showing
# the "contains terminal control codes" confirmation dialog (dropped `confirm`,
# added `replace-dangerous-control-codes`). `confirm-if-large` still warns on
# accidental >16KB pastes; remove it if you never want a prompt at all.
paste_actions          quote-urls-at-prompt,replace-dangerous-control-codes,confirm-if-large

# ── Tab bar ────────────────────────────────────────────────────────────
# Position and style
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted

# Trim the clutter
tab_title_template      "{index}: {title}"

# Color scheme (adapted from a dark-theme snippet for this light theme):
# active tab = Apple system blue with white text; inactive = light grey.
active_tab_foreground   #ffffff
active_tab_background   #007aff
active_tab_font_style   bold-italic
inactive_tab_foreground #4a4a4a
inactive_tab_background #d8d8d8
inactive_tab_font_style normal

# ── Tab navigation (⌘+number jumps to that tab) ────────────────────────
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# ── Confirm before closing ─────────────────────────────────────────────
# Always prompt on ⌘W (close tab), ⇧⌘W (close OS window), and ⌘Q (quit).
# The value is "ask if there are >= N kitty windows"; a POSITIVE 1 counts
# ALL windows, including ones sitting at a shell prompt. The default -1 is
# negative, and with `shell_integration enabled` that EXCLUDES shell-prompt
# windows from the count — which is why closing sometimes prompted and
# sometimes didn't. (Individual splits: map close_window_with_confirmation.)
confirm_os_window_close 1

# ── Modal hotkey menu (vim-style leader) ───────────────────────────────
# cmd+i opens hotkeys.py: a little TUI panel to navigate tab/window/layout/
# font actions by keypress. See config/kitty/hotkeys.py to edit the menu.
map cmd+i kitten hotkeys.py
# Open Meta diff/task refs (Dxxxxxxx / Txxxxxxx) that are visible on screen:
# now lives inside the ⌘I menu (press o). See config/kitty/hotkeys_config.py.

# ── Per-user overrides ─────────────────────────────────────────────────
# Optional; written by bootstrap.sh (e.g. for $USER == cay). No error if
# absent thanks to the leading `globinclude`-friendly guard below.
globinclude local.conf
