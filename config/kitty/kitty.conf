# kitty config — roughly mirrors the ghostty setup (light theme, SFMono).
# Reload after editing: ⌘+⌃+, (macOS) or `kill -SIGUSR1 $(pgrep kitty)`.

# ── Font ───────────────────────────────────────────────────────────────
# Apple's SF Mono @ 12, Light weight (the Regular face reads too heavy).
# NB: the "SFMono Nerd Font" patch isn't installed on this machine, and
# kitty (unlike ghostty's fuzzy CoreText matching) falls back to Menlo —
# noticeably heavier — when a family isn't found. So name the real installed
# family + style explicitly. kitty's built-in Nerd Font still provides
# icon/powerline glyphs via symbol fallback.
font_family      family="SF Mono" style="Light"
font_size        12.0

# Glyph compositing. macOS default is `platform` (== gamma 1.7, contrast 30),
# which renders dark-on-light text a touch heavier than ghostty. The 1st
# number is gamma (thickness of dark text on light bg): lower = thinner.
# Nudged 1.7 -> 1.5 to shave the extra weight. Tune: ~1.3 = thinner still,
# 1.7 = kitty default.
text_composition_strategy  1.5 30

# ── Padding ────────────────────────────────────────────────────────────
# Breathing room around the text (in pts). One value = all sides; you can
# also pass up to 4: `top right bottom left`.
window_padding_width   4

# ── Colors (ported verbatim from the iTerm2 "Default" profile) ──────────
# Apple system colors on white. The previous hand-rolled palette read
# muddy; these are the exact ANSI values iTerm2 uses so prompt/output
# colors match it 1:1.
background       #ffffff
foreground       #1a1a1a

# Selection + cursor, also from the iTerm2 Default profile.
selection_background #bbdcff
selection_foreground #1a1a1a
cursor               #007aff

# 16-color ANSI palette (iTerm2 Default profile).
color0  #000000
color8  #575757
color1  #e7291e
color9  #fc1005
color2  #19b230
color10 #00cb1e
color3  #ffcc00
color11 #ffcc00
color4  #007aff
color12 #5555ff
color5  #af52de
color13 #ff55ff
color6  #00c7be
color14 #00ced0
color7  #e6e6e6
color15 #ffffff

# ── Cursor ─────────────────────────────────────────────────────────────
# ghostty: block cursor, blinking
cursor_shape           block
cursor_blink_interval  0.5

# ── Shell ──────────────────────────────────────────────────────────────
# Disable kitty's shell integration. Its bash injection launches bash in
# POSIX mode via --posix/ENV, and macOS's ancient system bash (3.2.57) can't
# do the `set +o posix` handshake before sourcing ~/.bash_profile. That made
# every process-substitution and hyphenated-function line in the profile
# (fzf, git-completion, tmux-* / manifold-rebind) throw errors on startup.
# Disabling makes kitty launch a plain login shell (like iTerm/ghostty) =>
# clean startup. We use tmux for prompt/cwd/scroll niceties anyway.
shell_integration disabled

# ── Clipboard ──────────────────────────────────────────────────────────
# ghostty: copy-on-select = clipboard
copy_on_select         clipboard
# ghostty: ctrl+v = paste
map ctrl+v             paste_from_clipboard

# ── Tab bar ────────────────────────────────────────────────────────────
# Position and style
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted

# Trim the clutter
tab_title_template      "{index}: {title}"

# Color scheme (adapted from a dark-theme snippet for this light theme):
# active tab = Apple system blue with white text; inactive = light grey.
active_tab_foreground   #ffffff
active_tab_background   #007aff
active_tab_font_style   bold-italic
inactive_tab_foreground #4a4a4a
inactive_tab_background #d8d8d8
inactive_tab_font_style normal

# ── Tab navigation (⌘+number jumps to that tab) ────────────────────────
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# ── Modal hotkey menu (vim-style leader) ───────────────────────────────
# cmd+i opens hotkeys.py: a little TUI panel to navigate tab/window/layout/
# font actions by keypress. See config/kitty/hotkeys.py to edit the menu.
map cmd+i kitten hotkeys.py

# ── Per-user overrides ─────────────────────────────────────────────────
# Optional; written by bootstrap.sh (e.g. for $USER == cay). No error if
# absent thanks to the leading `globinclude`-friendly guard below.
globinclude local.conf
